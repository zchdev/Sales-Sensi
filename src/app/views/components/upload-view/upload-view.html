<div class="bg-white">
  <div class="col-5 center-content">
    <div class="d-flex justify-content-center text-center accent-foreground">
      <div>
        <img #box class="w-50" src="loaddata.png" />

        <p>{{ 'app.upload' | translate }}&hellip;</p>
      </div>
    </div>

    <div class="mt-3 accent-foreground">{{ 'app.dailyupload' | translate }}</div>
    <input
      type="file"
      class="form-control mt-2 accent-foreground"
      accept=".csv"
      #inputFileDaily
      multiple
      value="process2"
      (change)="loadDailyFile(inputFileDaily.files)"
    />
    <br />
    <div class="mt-3 d-flex justify-content-center">
      <button class="btn btn-primary w-50 mt-3" routerLink="/app/overview">
        {{ 'app.genupload' | translate }}
      </button>
    </div>
  </div>
</div>
